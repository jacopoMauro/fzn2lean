name = "fzn2lean"
version = "0.1.0"

# Pass an explicit thread count to every Lean invocation. Without it,
# Lean sizes its worker pool with `nproc` (256 on this host) while the
# cgroup CPU quota is 8 CPUs; thread creation then fails under load
# with `lean::exception: failed to create thread`.
[[lean_lib]]
name = "LeanFzn"
moreLeanArgs = ["-j2", "-s131072"]

[[lean_exe]]
name = "tests_smoke"
root = "Tests.Smoke"

[[lean_exe]]
name = "tests_stdlib"
root = "Tests.StdLib"

[[lean_exe]]
name = "leanfzn"
root = "Main"

[[lean_exe]]
name = "tests_solution"
root = "Tests.Solution"

[[lean_exe]]
name = "tests_gecode"
root = "Tests.Gecode"

[[lean_exe]]
name = "tests_globals"
root = "Tests.Globals"

[[lean_exe]]
name = "tests_bench"
root = "Tests.Bench"


[[lean_exe]]
name = "tests_coverage"
root = "Tests.Coverage"

[[lean_exe]]
name = "tests_wellformed"
root = "Tests.WellFormed"

[[lean_exe]]
name = "tests_pretty"
root = "Tests.Pretty"

[[lean_exe]]
name = "tests_prof"
root = "Tests.Prof"

[[lean_exe]]
name = "tests_check"
root = "Tests.Check"

[[lean_lib]]
name = "solver"
moreLeanArgs = ["-j2", "-s131072"]

[[lean_exe]]
name = "tests_solver"
root = "solver.Tests"

[[lean_exe]]
name = "tests_prop"
root = "solver.TestsProp"

[[lean_exe]]
name = "tests_fast"
root = "Tests.Fast"

[[lean_exe]]
name = "tests_lcg"
root = "solver.TestsLCG"
