name = "fzn2lean"
version = "0.1.0"
moreLeancArgs = ["-fprofile-use=pgo/default.profdata", "-Wno-profile-instr-unprofiled", "-Wno-profile-instr-out-of-date"]

[[lean_lib]]
name = "LeanFzn.Syntax"
globs = ["LeanFzn.Syntax", "LeanFzn.Syntax.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Parser"
globs = ["LeanFzn.Parser", "LeanFzn.Parser.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Semantics"
globs = ["LeanFzn.Semantics", "LeanFzn.Semantics.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Checker"
globs = ["LeanFzn.Checker", "LeanFzn.Checker.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Compiler"
globs = ["LeanFzn.Compiler", "LeanFzn.Compiler.+"]
moreLeanArgs = ["-j1", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Solver.Core"
globs = ["LeanFzn.Solver.Core", "LeanFzn.Solver.Core.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Solver.Propagation"
globs = ["LeanFzn.Solver.Propagation", "LeanFzn.Solver.Propagation.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Solver.Reference"
globs = ["LeanFzn.Solver.Reference", "LeanFzn.Solver.Reference.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Engine"
globs = ["LeanFzn.Engine", "LeanFzn.Engine.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn.Integration"
globs = ["LeanFzn.Integration", "LeanFzn.Integration.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "LeanFzn"
globs = ["LeanFzn"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.Parser.+", "Tests.Semantics.+", "Tests.Checker.+", "Tests.Compiler.+", "Tests.Engine.+", "Tests.Integration.+"]
moreLeanArgs = ["-j2", "-s131072"]

[[lean_exe]]
name = "tests_smoke"
root = "Tests.Parser.Smoke"

[[lean_exe]]
name = "tests_stdlib"
root = "Tests.Semantics.StdLib"

[[lean_exe]]
name = "leanfzn"
