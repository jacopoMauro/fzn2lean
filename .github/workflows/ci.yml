name: CI

on:
  push:
    branches: [main, lazySolver]
  pull_request:

jobs:
  build-test-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Build (all libraries, executables, all test targets)
        run: lake build LeanFzn solver leanfzn tests_smoke tests_stdlib tests_solution tests_gecode tests_globals tests_bench tests_coverage tests_wellformed tests_pretty tests_prof tests_check tests_fast tests_solver tests_prop tests_lcg
      - name: Run all 15 retained test suites
        run: |
          lake env tests_smoke
          lake env tests_stdlib
          lake env tests_solution
          lake env tests_gecode
          lake env tests_globals
          lake env tests_bench
          lake env tests_coverage
          lake env tests_wellformed
          lake env tests_pretty
          lake env tests_prof
          lake env tests_check
          lake env tests_fast
          lake env tests_solver
          lake env tests_prop
          lake env tests_lcg
      - name: Audit: no active proof holes
        run: |
          if grep -rnE '(^|[^a-zA-Z])(sorry|admit)([^a-zA-Z]|$)' \
              --include='*.lean' LeanFzn/ solver/ Tests/ Main.lean \
              | grep -vE ':\s*(--|st ← st\.check|IO\.)' \
              | grep -vE 'sorry-free|no admits|admits only|admits duplicate|admits no|proof target, not hidden|domains admit'; then
            echo "ERROR: active proof holes found"; exit 1
          fi
      - name: Audit: axiom profiles of the public certified theorems
        run: |
          lake env lean audits/certified_axioms.lean > /tmp/axiom_profiles.txt
          # FAIL on any proof hole
          if grep -E 'sorryAx' /tmp/axiom_profiles.txt; then
            echo "ERROR: sorryAx in a certified theorem"; exit 1
          fi
          # FAIL on any axiom outside the three standard Lean axioms
          # (profiles may wrap across lines; join first)
          if tr '\n' ' ' < /tmp/axiom_profiles.txt \
              | grep -o 'depends on axioms: \[[^]]*\]' \
              | sed 's/depends on axioms: \[//; s/\]//' | tr ',' '\n' \
              | sed 's/^ *//; s/ *$//' | sort -u \
              | grep -vE '^$|^propext$|^Classical\.choice$|^Quot\.sound$'; then
            echo "ERROR: unexpected axiom in a certified theorem's profile"; exit 1
          fi
      - name: Audit: no new user axioms
        run: |
          if grep -rnE '^\s*axiom ' --include='*.lean' LeanFzn/ solver/ Tests/ Main.lean; then
            echo "ERROR: user axioms found"; exit 1
          fi
